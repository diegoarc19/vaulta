# Redirigir HTTP → HTTPS (puerto externo 8443)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

# Servidor HTTPS con SSL
server {
    listen 443 ssl;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.php index.html;

    # Certificado autofirmado (generado en el Dockerfile.nginx)
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Protocolos y cifrados seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Si alguien envía HTTP al puerto HTTPS, redirigir automáticamente
    error_page 497 301 =301 https://$host:$server_port$request_uri;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
