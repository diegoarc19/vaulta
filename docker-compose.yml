services:
  # SERVIDOR WEB (Tu página) — con HTTPS
  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:80" # HTTP  → redirige automáticamente a HTTPS
      - "8443:443" # HTTPS → acceso seguro con certificado SSL
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - php

  # PHP-FPM (Procesador de PHP)
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./src:/usr/share/nginx/html
    depends_on:
      - db

  # BASE DE DATOS (MySQL)
  db:
    image: mysql:5.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finanzas_app
    volumes:
      - db_data:/var/lib/mysql
      - ./finanzas_app.sql:/docker-entrypoint-initdb.d/finanzas_app.sql:ro
    ports:
      - "3306:3306"

  # GESTOR VISUAL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db

  # MAILHOG (Captura emails de testing)
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8025:8025"   # Interfaz web para ver emails
      - "1025:1025"   # Puerto SMTP

  # UPTIME KUMA (Monitorización de servicios)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"

volumes:
  db_data:
  uptime_kuma_data:
